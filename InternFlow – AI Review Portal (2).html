<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InternFlow – AI Review Portal</title>
<style>
:root{--navy:#0b2447;--navy2:#19376d;--sky:#e8f1fb;--sky2:#a5d7e8;--bg:#f5f8fc;--card:#fff;--tx:#0f1b2d;--mut:#5b6b82;--bd:#d9e3f0;--ok:#1a7f4b;--warn:#b7791f;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#a5d7e8;--navy2:#7fb5d6;--sky:#16263f;--sky2:#2b4a6b;--bg:#0b1424;--card:#111e33;--tx:#e6eef9;--mut:#9fb0c7;--bd:#25375a;--ok:#4cc38a;--warn:#e0b04f;--bad:#ef7b6e}}
*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 20px;background:#0b2447;color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-size:18px;letter-spacing:.2px}header select,header button{font:inherit}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:none;border:0;color:#cfe0f5;padding:7px 12px;border-radius:8px;cursor:pointer}nav button.on{background:#19376d;color:#fff}
.role{display:flex;gap:8px;align-items:center}.role select{padding:6px;border-radius:8px;max-width:210px}
main{max-width:1180px;margin:0 auto;padding:20px;overflow-x:hidden}
h2{margin:0 0 14px;font-size:22px;color:var(--navy)}h3{margin:0 0 10px;font-size:16px;color:var(--navy)}
.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.stat b{display:block;font-size:28px;color:var(--navy)}.stat span{color:var(--mut);font-size:13px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--sky);color:var(--navy2);white-space:nowrap}
.b-Completed{background:#d8f3e4;color:#14673c}.b-Corrections{background:#fdecc8;color:#8a5a0b}.b-Ended{background:#f9d9d5;color:#9a2a1e}.b-Submitted{background:#d6e8ff;color:#1b4a8a}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}.bar i{display:block;height:12px;border-radius:6px;background:var(--navy2);min-width:3px}.bar em{width:150px;font-style:normal;color:var(--mut)}
.donut{width:130px;height:130px;border-radius:50%;margin:4px auto}.donut div{width:70px;height:70px;border-radius:50%;background:var(--card);margin:30px;text-align:center;line-height:70px;font-weight:700;color:var(--navy)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-weight:600}tr.row{cursor:pointer}tr.row:hover{background:var(--sky)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
.btn{background:var(--navy2);color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}.btn.alt{background:var(--sky);color:var(--navy2)}:root:not([data-theme="light"]) .btn{color:#0b1424}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #4a90d9;outline-offset:2px}
.issue{border-left:4px solid var(--warn);padding:8px 12px;margin:8px 0;background:var(--sky);border-radius:6px;font-size:14px}.issue.high{border-color:var(--bad)}.issue.low{border-color:var(--sky2)}.issue small{color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(5,15,35,.55);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}.modal.show{display:flex}.modal .card{max-width:720px;width:100%}
.x{float:right;background:none;border:0;font-size:22px;cursor:pointer;color:var(--mut)}
#fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:#0b2447;color:#fff;font-size:24px;cursor:pointer;z-index:10;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#chat{position:fixed;right:18px;bottom:84px;width:min(340px,calc(100vw - 36px));height:430px;display:none;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:14px;z-index:10;overflow:hidden}#chat.show{display:flex}
#chat h4{margin:0;padding:12px;background:#0b2447;color:#fff}#msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}.m{padding:8px 11px;border-radius:12px;max-width:88%;font-size:14px}.m.bot{background:var(--sky)}.m.me{background:var(--navy2);color:#fff;align-self:flex-end}
#chat form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd)}#chat input{flex:1;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:#0b2447;color:#fff;padding:10px 18px;border-radius:8px;z-index:30}
</style></head><body>
<header><b>InternFlow</b><nav id="nav"></nav>
<div class="role"><select id="role" aria-label="Role"><option value="admin">Admin / Mentor</option><option value="intern">Intern view</option></select><select id="who" aria-label="Intern" hidden></select></div></header>
<main id="app"></main>
<div class="modal" id="modal"><div class="card" id="mbody"></div></div>
<button id="fab" aria-label="Open assistant">💬</button>
<div id="chat"><h4>Project assistant</h4><div id="msgs"></div><form id="cf"><input id="ci" placeholder="Type here…" autocomplete="off"><button class="btn">Send</button></form></div>
<script>
const $=s=>document.querySelector(s);
const DOM={"Web Development":["Online Learning Portal","Inventory Dashboard","Event Booking Site"],"Data Science":["Sales Forecasting Model","Customer Churn Analysis","Retail Basket Analysis"],"AI/ML":["Sentiment Analyser","Image Classifier","Resume Screening Bot"],"Cybersecurity":["Password Strength Auditor","Phishing URL Detector","Network Log Analyser"],"Mobile Apps":["Expense Tracker App","Fitness Habit App","Campus Navigator"]};
const DK=Object.keys(DOM),FN="Aarav Diya Karthik Meena Rahul Priya Vikram Sneha Arjun Kavya Ishaan Nisha Rohan Anjali Siddharth Lakshmi Varun Pooja Harish Divya".split(" "),LN="Kumar Sharma Nair Iyer Reddy Patel Singh Rao Menon Das".split(" ");
const SK={"Web Development":"React, Node","Data Science":"Python, Pandas","AI/ML":"Python, PyTorch","Cybersecurity":"Linux, Networking","Mobile Apps":"Flutter, Firebase"};
let seed=7;const r=()=>(seed=(seed*16807)%2147483647)/2147483647,pick=a=>a[Math.floor(r()*a.length)];
const day=864e5,now=Date.now(),fd=t=>new Date(t).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
const ISSUES=[["high","Confirmed","Report §4 Results","Result table shows 92% accuracy but the screenshot shows 87%.","Update the table or re-run and attach a fresh screenshot."],["med","Confirmed","Report","Required section ‘Conclusion’ is missing.","Add a conclusion summarising results and limits."],["med","Possible","main.py, line 41","Loop may skip the last item (off-by-one). Code was not executed.","Check the loop bound and add a small test."],["low","Possible","Report §2","Objectives are broad and hard to measure.","Rewrite each objective with a measurable outcome."]];
const S=["Assigned","Submitted","Corrections Required","Completed","Internship Ended - Incomplete"];
const I=[];for(let i=1;i<=100;i++){const d=pick(DK),w=r(),st=w<.15?0:w<.35?1:w<.65?2:w<.9?3:4,start=now-Math.floor(r()*40+3)*day,rev=st==0?0:Math.floor(r()*3)+1;
 I.push({id:"INT-"+String(i).padStart(3,"0"),name:pick(FN)+" "+pick(LN),domain:d,skills:SK[d],project:pick(DOM[d]),start,end:start+90*day,status:S[st],score:st==0?null:Math.floor(r()*40+55),next:st==3||st==4?null:now+Math.floor(r()*6+1)*day,rev:Array.from({length:rev},(_,k)=>({n:k+1,date:start+(k*5+2)*day,score:Math.min(98,60+k*12+Math.floor(r()*10)),n_issues:Math.max(0,3-k),approved:k<rev-1||st==3,issues:ISSUES.slice(0,Math.max(1,3-k))})),emails:Math.floor(r()*6)+1,fail:r()<.05?1:0});
 I[i-1].email=I[i-1].name.toLowerCase().replace(" ",".")+"@mail.in"}
const logs=[];I.slice(0,40).forEach(x=>logs.push({to:x.email,t:pick(["Project assignment","Review invitation","Submission reminder","AI feedback","Next review invitation"]),d:now-Math.floor(r()*9)*day,ok:!x.fail}));
let view="dash",cur=I[0].id,fq="",fs="";
const bc=s=>s.startsWith("Comp")?"Completed":s.startsWith("Corr")?"Corrections":s.startsWith("Intern")?"Ended":s=="Submitted"?"Submitted":"";
const bd=s=>`<span class="badge b-${bc(s)}">${s}</span>`;
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}
function nav(){const a=$("#role").value=="admin",it=a?[["dash","Dashboard"],["interns","Interns"],["emails","Email log"]]:[["me","My project"]];if(!it.some(x=>x[0]==view))view=it[0][0];$("#who").hidden=a;$("#nav").innerHTML=it.map(x=>`<button class="${x[0]==view?"on":""}" data-v="${x[0]}">${x[1]}</button>`).join("");$("#nav").onclick=e=>{if(e.target.dataset.v){view=e.target.dataset.v;go()}}}
const cnt=f=>I.filter(f).length;
function bars(o){const m=Math.max(...Object.values(o));return Object.entries(o).map(([k,v])=>`<div class="bar"><em>${k}</em><i style="width:${v/m*55}%"></i>${v}</div>`).join("")}
function dash(){const sub=cnt(x=>x.status!="Assigned"),by={};S.forEach(s=>by[s]=cnt(x=>x.status==s));const dm={};DK.forEach(d=>dm[d]=cnt(x=>x.domain==d));
const ok=logs.filter(l=>l.ok).length,rt=Math.round(sub/I.length*100),st=[["Total interns",I.length],["Projects assigned",I.length],["Upcoming reviews",cnt(x=>x.next)],["Reports submitted",sub],["Pending submissions",I.length-sub],["AI reviews done",I.reduce((a,x)=>a+x.rev.length,0)],["Corrections required",by[S[2]]],["Completed",by[S[3]]],["Internship ended",by[S[4]]],["Emails sent / failed",ok+" / "+(logs.length-ok)]];
return `<h2>Admin dashboard</h2><div class="grid stats">${st.map(s=>`<div class="card stat"><b>${s[1]}</b><span>${s[0]}</span></div>`).join("")}</div><div class="grid two" style="margin-top:14px"><div class="card"><h3>Review outcomes</h3>${bars(by)}</div><div class="card"><h3>Submission rate</h3><div class="donut" style="background:conic-gradient(var(--navy2) ${rt}%,var(--sky2) 0)"><div>${rt}%</div></div><p style="text-align:center;color:var(--mut);margin:0">${sub} of ${I.length} interns have submitted</p></div><div class="card"><h3>Assignments by domain</h3>${bars(dm)}</div><div class="card"><h3>Mentor queue</h3><p style="margin-top:0">${cnt(x=>x.rev.some(v=>!v.approved))} AI reviews wait for your approval.</p><button class="btn" data-v="interns">Open interns</button></div></div>`}
function interns(){const rows=I.filter(x=>(x.name+x.id+x.project).toLowerCase().includes(fq.toLowerCase())&&(!fs||x.status==fs));
return `<h2>Interns</h2><div class="tools"><input id="q" placeholder="Search name, ID, project" value="${fq}"><select id="fs"><option value="">All statuses</option>${S.map(s=>`<option ${s==fs?"selected":""}>${s}</option>`).join("")}</select><button class="btn alt" id="csv">Import CSV</button><button class="btn alt" id="exp">Export CSV</button></div><div class="card tw"><table><tr><th>ID</th><th>Name</th><th>Domain</th><th>Project</th><th>Status</th><th>Next review</th></tr>${rows.slice(0,50).map(x=>`<tr class="row" data-id="${x.id}"><td>${x.id}</td><td>${x.name}</td><td>${x.domain}</td><td>${x.project}</td><td>${bd(x.status)}</td><td>${x.next?fd(x.next):"–"}</td></tr>`).join("")||"<tr><td colspan=6>No interns match these filters.</td></tr>"}</table></div><p style="color:var(--mut)">Showing ${Math.min(50,rows.length)} of ${rows.length}.</p>`}
function emails(){return `<h2>Email log</h2><div class="card tw"><table><tr><th>Recipient</th><th>Template</th><th>Sent</th><th>Status</th><th></th></tr>${logs.map((l,i)=>`<tr><td>${l.to}</td><td>${l.t}</td><td>${fd(l.d)}</td><td>${l.ok?"Delivered":"<b style=color:var(--bad)>Failed</b>"}</td><td>${l.ok?"":`<button class="btn alt" data-retry="${i}">Retry</button>`}</td></tr>`).join("")}</table></div>`}
function issues(v){return v.issues.map(i=>`<div class="issue ${i[0]}"><b>${i[1]}</b> · ${i[0]} severity · <small>${i[2]}</small><br>${i[3]}<br><small>Fix: ${i[4]}</small></div>`).join("")}
function revBlock(x,adm){return x.rev.length?x.rev.slice().reverse().map(v=>`<div class="card" style="margin-bottom:10px"><b>Review ${v.n}</b> · ${fd(v.date)} · Score ${v.score}/100 ${v.approved?bd("Approved by mentor"):bd("Awaiting mentor")}${issues(v)}${adm&&!v.approved?`<button class="btn" data-ap="${x.id}:${v.n}">Approve feedback &amp; send email</button>`:""}</div>`).join(""):"<p>No reviews yet. The first review email goes out two days after assignment.</p>"}
function detail(id){const x=I.find(a=>a.id==id);$("#mbody").innerHTML=`<button class="x" aria-label="Close">×</button><h2>${x.name} <small style="font-size:13px;color:var(--mut)">${x.id}</small></h2><p>${x.email} · ${x.domain} · ${x.skills}<br>Project: <b>${x.project}</b> ${bd(x.status)}<br>Internship: ${fd(x.start)} to ${fd(x.end)}</p><div class="tools"><select id="np">${DOM[x.domain].map(p=>`<option ${p==x.project?"selected":""}>${p}</option>`).join("")}</select><button class="btn alt" data-reas="${x.id}">Reassign project</button><button class="btn alt" data-ext="${x.id}">Extend 30 days</button></div><h3>Review history</h3>${revBlock(x,1)}`;$("#modal").classList.add("show")}
function me(){const x=I.find(a=>a.id==cur),done=x.status.startsWith("Comp");
return `<h2>Welcome, ${x.name.split(" ")[0]}</h2><div class="grid two"><div class="card"><h3>${x.project}</h3>${bd(x.status)}<p>Build the project for your <b>${x.domain}</b> track. Deliver a PDF/DOCX report, source code and output screenshots.</p><p>Deadline: <b>${fd(x.next?x.next-day:x.end)}</b><br>Next review: <b>${x.next?fd(x.next)+" · 11:00":"–"}</b> ${x.next?'<a href="#" data-link>Join meeting</a>':""}</p><div class="bar"><em>Progress</em><i style="width:${done?55:Math.min(50,x.rev.length*18)}%"></i></div></div>
<div class="card"><h3>Submit your work</h3>${done?"<p>Project approved. Your final report is stored.</p>":`<p style="margin-top:0">Report (PDF or DOCX), code file and screenshots.</p><input type="file" id="fl" multiple accept=".pdf,.docx,.zip,.py,.js,.java,.png,.jpg"><p><button class="btn" id="sub">Upload &amp; request AI review</button></p><p id="res" style="color:var(--mut);margin:0"></p>`}</div></div><div class="card" style="margin-top:14px"><h3>AI feedback &amp; submission history</h3>${revBlock(x,0)}</div>`}
function go(){nav();const a=$("#role").value=="admin";$("#app").innerHTML=a?({dash,interns,emails}[view]||dash)():me()}
$("#role").onchange=go;$("#who").innerHTML=I.map(x=>`<option value="${x.id}">${x.id} ${x.name}</option>`).join("");$("#who").onchange=e=>{cur=e.target.value;go()};
document.addEventListener("input",e=>{if(e.target.id=="q"){fq=e.target.value;const p=e.target.selectionStart;go();const q=$("#q");q.focus();q.setSelectionRange(p,p)}});
document.addEventListener("change",e=>{if(e.target.id=="fs"){fs=e.target.value;go()}});
document.addEventListener("click",e=>{const t=e.target,row=t.closest("tr.row");
 if(t.dataset.v){view=t.dataset.v;go()}else if(row)detail(row.dataset.id);
 else if(t.classList.contains("x")||t.id=="modal")$("#modal").classList.remove("show");
 else if(t.dataset.link){e.preventDefault();toast("Meeting link opens in Google Meet")}
 else if(t.dataset.retry){logs[t.dataset.retry].ok=true;toast("Email re-sent");go()}
 else if(t.dataset.ap){const[id,n]=t.dataset.ap.split(":"),x=I.find(a=>a.id==id);x.rev[n-1].approved=true;logs.unshift({to:x.email,t:"AI feedback",d:Date.now(),ok:true});x.emails++;toast("Approved. Feedback email queued.");detail(id)}
 else if(t.dataset.reas){const x=I.find(a=>a.id==t.dataset.reas);x.project=$("#np").value;toast("Project reassigned");detail(x.id)}
 else if(t.dataset.ext){const x=I.find(a=>a.id==t.dataset.ext);x.end+=30*day;if(x.status.startsWith("Intern"))x.status="Corrections Required";toast("Internship extended");detail(x.id)}
 else if(t.id=="csv"){toast("CSV import needs the backend API (parsed here as a preview only)")}
 else if(t.id=="exp"){const b=new Blob(["id,name,email,domain,project,status\n"+I.map(x=>[x.id,x.name,x.email,x.domain,x.project,x.status].join(",")).join("\n")],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="interns.csv";a.click()}
 else if(t.id=="sub"){const f=$("#fl").files;if(!f.length){$("#res").textContent="Choose at least one file first.";return}
  const bad=[...f].find(z=>!/\.(pdf|docx|zip|py|js|java|png|jpg)$/i.test(z.name));if(bad){$("#res").textContent=bad.name+" is not an allowed file type.";return}
  const x=I.find(a=>a.id==cur);$("#res").textContent="AI is reviewing "+f.length+" file(s)…";setTimeout(()=>{const n=x.rev.length+1,k=Math.max(0,3-n),sc=Math.min(98,58+n*13);x.rev.push({n,date:Date.now(),score:sc,n_issues:k,approved:false,issues:k?ISSUES.slice(0,k):[["low","Possible","Report","No blocking problems found. Code was not executed.","Mentor will confirm."]]});x.status=k?"Corrections Required":"Submitted";x.score=sc;x.next=Date.now()+5*day;toast("AI review ready for mentor approval");go()},1200)}});
// chatbot (rule-based demo; the backend swaps in an LLM)
const msgs=$("#msgs");function say(t,me){const d=document.createElement("div");d.className="m "+(me?"me":"bot");d.textContent=t;msgs.append(d);msgs.scrollTop=1e9}
let step=0,cx=null;say("Hi! Enter your intern ID (for example INT-001) to get your project.");
$("#fab").onclick=()=>$("#chat").classList.toggle("show");
$("#cf").onsubmit=e=>{e.preventDefault();const v=$("#ci").value.trim();if(!v)return;$("#ci").value="";say(v,1);
 if(step==0){cx=I.find(a=>a.id.toLowerCase()==v.toLowerCase());if(!cx){say("I can’t find that ID. Check it and try again.");return}
  say("Welcome, "+cx.name+"! Your domain is "+cx.domain+". Type ‘assign’ to see your project or ‘status’ for progress.");step=1}
 else if(/assign|project/i.test(v)){say(cx.assigned?"You already have a project, so I can’t assign another: "+cx.project+".":"Project: "+cx.project+". Objective: build a working "+cx.domain+" solution. Deliverables: report, source code, screenshots. First review in 2 days.");cx.assigned=1}
 else if(/status/i.test(v))say("Status: "+cx.status+". Next review: "+(cx.next?fd(cx.next):"none")+".");
 else say("I can help with ‘assign’ or ‘status’.")};
go();
</script></body></html>
